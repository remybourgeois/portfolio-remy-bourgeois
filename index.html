        // --- COMPOSANT REVEAL ON SCROLL ---
        const RevealOnScroll = ({ children }) => {
            const ref = useRef(null);
            const [isVisible, setIsVisible] = useState(false);
            
            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) {
                        setIsVisible(true);
                        observer.disconnect();
                    }
                }, { threshold: 0.1 });
                
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, []);
            
            return (
                <div ref={ref} className={`transition-all duration-1000 transform ${isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'}`}>
                    {children}
                </div>
            );
        };

        // --- COMPOSANT ANIMATED COUNTER ---
        const AnimatedCounter = ({ end, suffix = "", duration = 2000 }) => {
            const [count, setCount] = useState(0);
            const ref = useRef(null);
            const [isVisible, setIsVisible] = useState(false);
            
            useEffect(() => {
                const observer = new IntersectionObserver(([entry]) => {
                    if (entry.isIntersecting) {
                        setIsVisible(true);
                        observer.disconnect();
                    }
                }, { threshold: 0.5 });
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, []);

            useEffect(() => {
                const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
                if (prefersReducedMotion) {
                    setCount(end);
                    return;
                }

                if (!isVisible) return;
                let startTime;
                let animationFrame;
                const animate = (timestamp) => {
                    if (!startTime) startTime = timestamp;
                    const progress = timestamp - startTime;
                    const percentage = Math.min(progress / duration, 1);
                    // Ease out expo
                    const ease = percentage === 1 ? 1 : 1 - Math.pow(2, -10 * percentage);
                    setCount(Math.floor(end * ease));
                    if (progress < duration) {
                        animationFrame = requestAnimationFrame(animate);
                    }
                };
                animationFrame = requestAnimationFrame(animate);
                return () => cancelAnimationFrame(animationFrame);
            }, [isVisible, end, duration]);

            return <span ref={ref} aria-label={`${count}${suffix}`}>{count}{suffix}</span>;
        };

        class AudioEngine {
            constructor() {
                this.ctx = null;
                this.isInitialized = false;
                this.masterGain = null;
                this.bgmGain = null; 
                this.staticNode = null;
                this.staticFilter = null;
                this.staticGain = null;
                this.staticBuffer = null;
                this.bgmElement = null;
                this.bgmSourceNode = null;
                this.bgmVolume = 0.8; 
                this.sfxVolume = 0.5; 
                this.isGlobalMuted = false;
                this.fadeInterval = null;
                this.isSuspendedForVisibility = false;
                this.sfxBuffers = {};
                this.loadSFX(SFX_CLICKS.concat([SFX_SUCCESS, SFX_BACK]));
            }

            async loadSFX(urls) {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                    this.masterGain = this.ctx.createGain();
                    this.masterGain.gain.value = this.isGlobalMuted ? 0 : 0.15;
                    this.masterGain.connect(this.ctx.destination);
                    this.bgmGain = this.ctx.createGain();
                    this.bgmGain.gain.value = this.bgmVolume; 
                    this.bgmGain.connect(this.masterGain);
                }
                const promises = urls.map(async (url) => {
                    try {
                        const response = await fetch(url);
                        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                        const arrayBuffer = await response.arrayBuffer();
                        const audioBuffer = await this.ctx.decodeAudioData(arrayBuffer);
                        this.sfxBuffers[url] = audioBuffer;
                    } catch (e) {
                        console.warn(`Erreur chargement SFX ${url}:`, e);
                    }
                });
                await Promise.all(promises);
            }

            init() {
                if (this.isInitialized) return;
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!this.ctx) {
                    this.ctx = new AudioContext();
                    this.masterGain = this.ctx.createGain();
                    this.masterGain.gain.value = this.isGlobalMuted ? 0 : 0.15;
                    this.masterGain.connect(this.ctx.destination);
                    this.bgmGain = this.ctx.createGain();
                    this.bgmGain.gain.value = this.bgmVolume; 
                    this.bgmGain.connect(this.masterGain);
                }
                const bufferSize = this.ctx.sampleRate * 2;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                let lastOut = 0;
                for (let i = 0; i < bufferSize; i++) {
                    const white = Math.random() * 2 - 1;
                    data[i] = (lastOut + (0.02 * white)) / 1.02;
                    lastOut = data[i];
                    data[i] *= 3.5; 
                }
                this.staticBuffer = buffer;
                if (this.bgmElement && !this.bgmSourceNode) {
                    this.connectBGMToWebAudio();
                }
                this.isInitialized = true;
            }
            
            setupBGM(url) {
                this.bgmElement = new Audio(url);
                this.bgmElement.loop = true;
                this.bgmElement.volume = 1; 
                this.bgmElement.crossOrigin = "anonymous";
                this.bgmElement.addEventListener('error', (e) => {
                    console.warn("Audio background non trouvé (normal en preview)");
                });
            }

            connectBGMToWebAudio() {
                if (!this.ctx || !this.bgmElement) return;
                try {
                    this.bgmSourceNode = this.ctx.createMediaElementSource(this.bgmElement);
                    this.bgmSourceNode.connect(this.bgmGain);
                } catch (e) {
                    console.log("Source déjà connectée ou erreur context", e);
                }
            }

            wakeUpAudio() {
                if(this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
                if(this.bgmElement && this.bgmElement.paused && !this.isGlobalMuted) {
                     this.bgmElement.play().catch(e => {});
                }
            }

            suspendForVisibility() {
                this.isSuspendedForVisibility = true;
                if (this.ctx) this.ctx.suspend();
                if (this.bgmElement) this.bgmElement.pause();
            }

            resumeFromVisibility() {
                this.isSuspendedForVisibility = false;
                if (this.ctx) this.ctx.resume();
                if (this.bgmElement && !this.isGlobalMuted) {
                    this.bgmElement.play().catch(() => {});
                }
            }

            startBGM() {
                if (!this.bgmElement) return;
                if (!this.isInitialized) this.init();
                if (this.bgmGain) {
                    this.bgmGain.gain.cancelScheduledValues(this.ctx.currentTime);
                    this.bgmGain.gain.value = this.isGlobalMuted ? 0 : this.bgmVolume;
                }
                this.bgmElement.play().catch(e => {
                    console.log("Autoplay bloqué", e);
                });
            }

            fadeOutBGM() {
                if (!this.bgmGain || !this.ctx) return;
                const now = this.ctx.currentTime;
                const duration = 1.5; 
                this.bgmGain.gain.cancelScheduledValues(now);
                this.bgmGain.gain.setValueAtTime(this.bgmGain.gain.value, now);
                this.bgmGain.gain.linearRampToValueAtTime(0, now + duration);
                setTimeout(() => {
                    if (this.bgmElement) this.bgmElement.pause();
                }, duration * 1000);
            }

            fadeInBGM() {
                if (!this.bgmElement) return;
                if (!this.isInitialized) this.init();
                this.bgmElement.currentTime = 0;
                this.bgmElement.play().catch(()=>{});
                if (this.bgmGain) {
                    const now = this.ctx.currentTime;
                    const target = this.isGlobalMuted ? 0 : this.bgmVolume;
                    this.bgmGain.gain.cancelScheduledValues(now);
                    this.bgmGain.gain.setValueAtTime(0, now);
                    this.bgmGain.gain.linearRampToValueAtTime(target, now + 2);
                }
            }
            
            setGlobalMute(isMuted) {
                this.isGlobalMuted = isMuted;
                if(this.masterGain && this.ctx) {
                    const now = this.ctx.currentTime;
                    this.masterGain.gain.cancelScheduledValues(now);
                    const targetVolume = isMuted ? 0 : 0.15; 
                    this.masterGain.gain.setTargetAtTime(targetVolume, now, 0.1);
                }
            }

            updateStatic(intensity) {
                if (!this.isInitialized || !this.ctx) return;
                if (intensity < 0.05) {
                    if (this.staticGain) this.staticGain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.1);
                    return;
                }
                if (!this.staticNode) {
                    this.staticNode = this.ctx.createBufferSource();
                    this.staticNode.buffer = this.staticBuffer;
                    this.staticNode.loop = true;
                    this.staticFilter = this.ctx.createBiquadFilter();
                    this.staticFilter.type = 'bandpass';
                    this.staticFilter.Q.value = 1;
                    this.staticGain = this.ctx.createGain();
                    this.staticGain.gain.value = 0;
                    this.staticNode.connect(this.staticFilter);
                    this.staticFilter.connect(this.staticGain);
                    this.staticGain.connect(this.masterGain);
                    this.staticNode.start();
                }
                const now = this.ctx.currentTime;
                const vol = Math.min(intensity * 0.4, 0.5) * this.sfxVolume; 
                const freq = 200 + (intensity * 2000); 
                this.staticGain.gain.setTargetAtTime(vol, now, 0.05);
                this.staticFilter.frequency.setTargetAtTime(freq, now, 0.05);
            }

            playSound(url) {
                if (!this.ctx || !this.sfxBuffers[url] || this.isGlobalMuted) return;
                const source = this.ctx.createBufferSource();
                source.buffer = this.sfxBuffers[url];
                const gain = this.ctx.createGain();
                gain.gain.value = this.sfxVolume; 
                source.connect(gain);
                gain.connect(this.masterGain);
                source.start(0);
            }

            playIntro() {
                if (!this.isInitialized || !this.ctx || this.isGlobalMuted) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();
                const t = this.ctx.currentTime;
                const duration = 2.5;
                const noise = this.ctx.createBufferSource();
                noise.buffer = this.staticBuffer;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(200, t);
                filter.frequency.linearRampToValueAtTime(800, t + 1); 
                filter.frequency.exponentialRampToValueAtTime(100, t + duration);
                const noiseGain = this.ctx.createGain();
                noiseGain.gain.setValueAtTime(0, t);
                noiseGain.gain.linearRampToValueAtTime(0.4 * this.sfxVolume, t + 0.5); 
                noiseGain.gain.linearRampToValueAtTime(0, t + duration);
                noise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(this.masterGain);
                noise.start();
                noise.stop(t + duration + 0.5);
            }
            
            playReset() {
                if (!this.isInitialized || !this.ctx || this.isGlobalMuted) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();
                
                if (this.sfxBuffers[SFX_BACK]) {
                    this.playSound(SFX_BACK);
                } else {
                    const t = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const g = this.ctx.createGain();
                    osc.connect(g);
                    g.connect(this.masterGain);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, t);
                    osc.frequency.setValueAtTime(330, t + 0.1);
                    osc.frequency.setValueAtTime(220, t + 0.2);
                    g.gain.setValueAtTime(0.15 * this.sfxVolume, t);
                    g.gain.linearRampToValueAtTime(0, t + 0.5);
                    osc.start(t);
                    osc.stop(t + 0.5);
                }
            }
        }

                const height = window.innerHeight;
                const scene = new THREE.Scene();
                scene.background = new THREE.Color("#020205"); 
                scene.fog = new THREE.FogExp2(0x020205, 0.002);
                const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
                camera.position.z = 7;
                const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
                renderer.setSize(width, height);
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                
                // IMPORTANT: Canvas ignoré par les lecteurs d'écran car décoratif
                renderer.domElement.setAttribute('aria-hidden', 'true');
                renderer.domElement.setAttribute('role', 'presentation');
                
                if (mountRef.current) { mountRef.current.innerHTML = ''; mountRef.current.appendChild(renderer.domElement); }

                // Réduction du nombre de particules si reduced motion
                const particlesCount = prefersReducedMotion ? 500 : 2800;
                
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(particlesCount * 3);
                const colors = new Float32Array(particlesCount * 3);
                const spherePos = new Float32Array(particlesCount * 3);
                const heartPos = new Float32Array(particlesCount * 3);
                const cubePos = new Float32Array(particlesCount * 3);
                const torusPos = new Float32Array(particlesCount * 3);
                const spiralPos = new Float32Array(particlesCount * 3);
                const diamondPos = new Float32Array(particlesCount * 3);
                const ringPos = new Float32Array(particlesCount * 3);
                const cylinderPos = new Float32Array(particlesCount * 3);
                const infinityPos = new Float32Array(particlesCount * 3);
                const colorBase = new THREE.Color(PRIMARY_COLOR);

                for(let i = 0; i < particlesCount; i++) {
                    const i3 = i * 3;
                    const s = getSpherePoint(2.5); spherePos[i3] = s.x; spherePos[i3+1] = s.y; spherePos[i3+2] = s.z;
                    const h = getHeartPoint(2.5); heartPos[i3] = h.x; heartPos[i3+1] = h.y; heartPos[i3+2] = h.z;
                    const c = getCubePoint(3.5); cubePos[i3] = c.x; cubePos[i3+1] = c.y; cubePos[i3+2] = c.z;
                    const t = getTorusPoint(2, 0.8); torusPos[i3] = t.x; torusPos[i3+1] = t.y; torusPos[i3+2] = t.z;
                    const sp = getSpiralPoint(4, 1.5); spiralPos[i3] = sp.x; spiralPos[i3+1] = sp.y; spiralPos[i3+2] = sp.z;
                    const d = getDiamondPoint(4.5); diamondPos[i3] = d.x; diamondPos[i3+1] = d.y; diamondPos[i3+2] = d.z;
                    const r = getRingPoint(3.5, 0.5); ringPos[i3] = r.x; ringPos[i3+1] = r.y; ringPos[i3+2] = r.z;
                    const cyl = getCylinderPoint(1.5, 5); cylinderPos[i3] = cyl.x; cylinderPos[i3+1] = cyl.y; cylinderPos[i3+2] = cyl.z;
                    const inf = getInfinityPoint(4.0, 0.6); infinityPos[i3] = inf.x; infinityPos[i3+1] = inf.y; infinityPos[i3+2] = inf.z;
                    positions[i3] = s.x; positions[i3+1] = s.y; positions[i3+2] = s.z;
                    colors[i3] = colorBase.r; colors[i3+1] = colorBase.g; colors[i3+2] = colorBase.b;
                }
                
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                const sprite = new THREE.TextureLoader().load('https://threejs.org/examples/textures/sprites/spark1.png');
                const material = new THREE.PointsMaterial({ size: 0.15, map: sprite, transparent: true, opacity: 0.85, vertexColors: true, blending: THREE.AdditiveBlending, depthWrite: false });
                const particlesSystem = new THREE.Points(geometry, material);
                scene.add(particlesSystem);
                particlesRef.current = particlesSystem;

                const bgCount = prefersReducedMotion ? 200 : 2500; 
                const bgGeometry = new THREE.BufferGeometry();
                const bgPositions = new Float32Array(bgCount * 3);
                const bgColors = new Float32Array(bgCount * 3);
                const bgVelocities = [];
                for(let i = 0; i < bgCount; i++) {
                    const i3 = i * 3;
                    bgPositions[i3] = (Math.random() - 0.5) * 35;
                    bgPositions[i3+1] = (Math.random() - 0.5) * 35;
                    bgPositions[i3+2] = (Math.random() - 0.5) * 20 - 5;
                    const rand = Math.random();
                    let col;
                    if (rand > 0.7) col = new THREE.Color(PRIMARY_COLOR);
                    else if (rand > 0.4) col = new THREE.Color(SECONDARY_COLOR);
                    else col = new THREE.Color(0xffffff);
                    bgColors[i3] = col.r; bgColors[i3+1] = col.g; bgColors[i3+2] = col.b;
                    bgVelocities.push({ x: (Math.random() - 0.5) * 0.01, y: (Math.random() - 0.5) * 0.01, z: (Math.random() - 0.5) * 0.01 });
                }
                bgGeometry.setAttribute('position', new THREE.BufferAttribute(bgPositions, 3));
                bgGeometry.setAttribute('color', new THREE.BufferAttribute(bgColors, 3));
                const bgMaterial = new THREE.PointsMaterial({ size: 0.09, map: sprite, transparent: true, opacity: 0.5, vertexColors: true, blending: THREE.AdditiveBlending, depthWrite: false });
                const bgParticlesSystem = new THREE.Points(bgGeometry, bgMaterial);
                scene.add(bgParticlesSystem);
                bgParticlesRef.current = { mesh: bgParticlesSystem, velocities: bgVelocities };
                
                // ACCENT (Supprimé si Reduced Motion pour alléger)
                const accentCount = prefersReducedMotion ? 0 : 400;
                let accentParticlesSystem;
                let accentVelocities = [];
                
                if (!prefersReducedMotion) {
                    const accentGeometry = new THREE.BufferGeometry();
                    const accentPositions = new Float32Array(accentCount * 3);
                    const accentColors = new Float32Array(accentCount * 3);
                    
                    for(let i = 0; i < accentCount; i++) {
                        const i3 = i * 3;
                        accentPositions[i3] = (Math.random() - 0.5) * 25;
                        accentPositions[i3+1] = (Math.random() - 0.5) * 25;
                        accentPositions[i3+2] = (Math.random() - 0.5) * 15;
                        const col = Math.random() > 0.5 ? new THREE.Color(TERTIARY_COLOR) : new THREE.Color(PRIMARY_COLOR);
                        accentColors[i3] = col.r; accentColors[i3+1] = col.g; accentColors[i3+2] = col.b;
                        accentVelocities.push({ x: (Math.random() - 0.5) * 0.02, y: (Math.random() - 0.5) * 0.02, z: (Math.random() - 0.5) * 0.02 });
                    }
                    accentGeometry.setAttribute('position', new THREE.BufferAttribute(accentPositions, 3));
                    accentGeometry.setAttribute('color', new THREE.BufferAttribute(accentColors, 3));
                    const accentMaterial = new THREE.PointsMaterial({ size: 0.07, map: sprite, transparent: true, opacity: 0.7, vertexColors: true, blending: THREE.AdditiveBlending, depthWrite: false });
                    accentParticlesSystem = new THREE.Points(accentGeometry, accentMaterial);
                    scene.add(accentParticlesSystem);
                }

                const onMouseMove = (e) => { 
                    prevMouseRef.current.copy(mouseRef.current);
                    mouseRef.current.x = (e.clientX / window.innerWidth) * 2 - 1; 
                    mouseRef.current.y = -(e.clientY / window.innerHeight) * 2 + 1; 
                    idleTimerRef.current = 0;
                    if (currentMoodRef.current !== 'excited') { currentMoodRef.current = 'calm'; }
                };
                const onResize = () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); };
                window.addEventListener('mousemove', onMouseMove);
                window.addEventListener('resize', onResize);

                let time = 0; 
                let currentRotX = 0; let currentRotY = 0; 
                const currentPosVec = new THREE.Vector3(); const targetPosVec = new THREE.Vector3(); 
                const tempColor = new THREE.Color(); 
                const targetColor = new THREE.Color(PRIMARY_COLOR);
                const hotColorObj = new THREE.Color(HOT_COLOR);

                let reqId;

                const animate = () => {
                    reqId = requestAnimationFrame(animate);
                    
                    // Facteur de vitesse réduit si "Reduced Motion"
                    const speedFactor = prefersReducedMotion ? 0.1 : 1.0;
                    time += 0.008 * speedFactor; 
                    
                    let introFactor = 0;
                    if (window._introStartTime) {
                        const elapsed = (Date.now() - window._introStartTime) / 1000;
                        if (elapsed < 2.0) introFactor = Math.sin((elapsed / 2.0) * Math.PI);
                        else window._introStartTime = null;
                    }

                    if (!prefersReducedMotion) {
                        idleTimerRef.current += 0.01;
                        if (!isLockedRef.current && idleTimerRef.current > 3.0) {
                            if (Math.random() < 0.005) {
                                const moods = ['calm', 'breathing', 'drift', 'nervous'];
                                currentMoodRef.current = moods[Math.floor(Math.random() * moods.length)];
                                moodColorOffsetRef.current = {
                                    r: (Math.random() - 0.5) * 0.2,
                                    g: (Math.random() - 0.5) * 0.2,
                                    b: (Math.random() - 0.5) * 0.2
                                };
                            }
                        }
                    }

                    const dx = mouseRef.current.x - prevMouseRef.current.x;
                    const dy = mouseRef.current.y - prevMouseRef.current.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    velocityRef.current += (dist - velocityRef.current) * 0.1;
                    
                    if (velocityRef.current > 0.02) { 
                        if (rubbingStartTimeRef.current === null) rubbingStartTimeRef.current = Date.now(); 
                        else if (Date.now() - rubbingStartTimeRef.current > 200) isRubbingActiveRef.current = true; 
                    } else {
                        rubbingStartTimeRef.current = null; 
                        isRubbingActiveRef.current = false; 
                    }

                    if (isRubbingActiveRef.current) {
                         frictionHeatRef.current += velocityRef.current * 0.5;
                         currentMoodRef.current = 'excited';
                         idleTimerRef.current = 0;
                    }
                    frictionHeatRef.current *= 0.92;
                    if (audioManagerRef.current) audioManagerRef.current.updateStatic(frictionHeatRef.current);

                    if (vibrationRef.current > 0) {
                        vibrationRef.current -= 0.05;
                        if (vibrationRef.current < 0) vibrationRef.current = 0;
                    }
                    
                    if (floodRef.current !== 0) {
                        if (floodRef.current > 0) floodRef.current += 0.010; 
                        else { floodRef.current += 0.05; if (floodRef.current > 0) floodRef.current = 0; }
                    }

                    // Réduction mouvements caméra/rotation
                    const targetRotX = prefersReducedMotion ? 0.001 : 0.001 + mouseRef.current.y * 0.3; 
                    const targetRotY = prefersReducedMotion ? 0.002 : 0.002 + mouseRef.current.x * 0.3; 
                    const inertia = prefersReducedMotion ? 0.01 : 0.03; 
                    let moodSpin = 0;
                    if (!prefersReducedMotion) {
                        if (currentMoodRef.current === 'drift') moodSpin = Math.sin(time * 0.5) * 0.005;
                        if (currentMoodRef.current === 'nervous') moodSpin = (Math.random() - 0.5) * 0.02;
                    }

                    currentRotX += (targetRotX - currentRotX) * inertia + moodSpin;
                    currentRotY += (targetRotY - currentRotY) * inertia + 0.003 * speedFactor + moodSpin;

                    particlesSystem.rotation.x = currentRotX; 
                    particlesSystem.rotation.y = currentRotY;

                    // Physique simplifiée en reduced motion
                    const targetX = prefersReducedMotion ? 0 : mouseRef.current.x * 0.8;
                    const targetY = prefersReducedMotion ? 0 : mouseRef.current.y * 0.8;

                    const diffX = targetX - particlesSystem.position.x;
                    const diffY = targetY - particlesSystem.position.y;
                    
                    const lerpSpeed = prefersReducedMotion ? 0.02 : 0.08; 
                    particlesSystem.position.x += diffX * lerpSpeed;
                    particlesSystem.position.y += diffY * lerpSpeed;

                    if (!prefersReducedMotion && currentMoodRef.current === 'drift') {
                        particlesSystem.position.x += Math.sin(time * 0.3) * 0.002;
                        particlesSystem.position.y += Math.cos(time * 0.4) * 0.002;
                    }
                    
                    const stretchFactor = prefersReducedMotion ? 0 : 0.3; 
                    const scaleX = 1 + Math.abs(diffX) * stretchFactor;
                    const scaleY = 1 + Math.abs(diffY) * stretchFactor;
                    
                    particlesSystem.scale.x += (scaleX - particlesSystem.scale.x) * 0.1;
                    particlesSystem.scale.y += (scaleY - particlesSystem.scale.y) * 0.1;

                    const positionsAttribute = particlesSystem.geometry.attributes.position;
                    const colorsAttribute = particlesSystem.geometry.attributes.color;
                    
                    let targetArray = spherePos;
                    let currentShape = targetGeometryRef.current;
                    if (currentShape === 'torus') targetArray = torusPos;
                    else if (currentShape === 'cube') targetArray = cubePos;
                    else if (currentShape === 'breathing') targetArray = spherePos; 
                    else if (currentShape === 'spiral') targetArray = spiralPos;
                    else if (currentShape === 'diamond') targetArray = diamondPos;
                    else if (currentShape === 'wave') targetArray = spherePos; 
                    else if (currentShape === 'ring') targetArray = ringPos;
                    else if (currentShape === 'heart') targetArray = heartPos;
                    else if (currentShape === 'cylinder') targetArray = cylinderPos;
                    else if (currentShape === 'infinity') targetArray = infinityPos;

                    if (currentShape === 'heart' || currentShape === 'breathing') targetColor.set(PRIMARY_COLOR);
                    else if (currentShape === 'cube' || currentShape === 'diamond') targetColor.set(SECONDARY_COLOR);
                    else if (currentShape === 'spiral' || currentShape === 'ring' || currentShape === 'infinity') targetColor.set(TERTIARY_COLOR);
                    else targetColor.set(PRIMARY_COLOR);

                    if (!prefersReducedMotion) {
                        targetColor.r = Math.max(0, Math.min(1, targetColor.r + moodColorOffsetRef.current.r));
                        targetColor.g = Math.max(0, Math.min(1, targetColor.g + moodColorOffsetRef.current.g));
                        targetColor.b = Math.max(0, Math.min(1, targetColor.b + moodColorOffsetRef.current.b));
                    }

                    for(let i = 0; i < particlesCount; i++) {
                        const i3 = i * 3;
                        let tx = targetArray[i3]; let ty = targetArray[i3+1]; let tz = targetArray[i3+2];
                        
                        if (!prefersReducedMotion) {
                            if (currentShape === 'heart') { const breath = 1 + Math.sin(time * 4) * 0.03; tx *= breath; ty *= breath; tz *= breath; }
                            else if (currentShape === 'breathing' || currentMoodRef.current === 'breathing') { const breath = 1 + Math.sin(time * 3 + i * 0.01) * 0.15; tx *= breath; ty *= breath; tz *= breath; }
                            else if (currentShape === 'wave') { tx += Math.sin(time * 2 + ty) * 0.2; tz += Math.cos(time * 2 + tx) * 0.2; }
                            else if (currentShape === 'infinity') { const wave = Math.sin(time * 3 + tx * 0.5) * 0.1; tx += wave; ty += wave; }
                        }

                        if (introFactor > 0) { const expansion = 1 + (introFactor * 0.2); tx *= expansion; ty *= expansion; tz *= expansion; const jitter = (Math.random() - 0.5) * 0.3 * introFactor; tx += jitter; ty += jitter; tz += jitter; }
                        if (currentMoodRef.current === 'nervous' || (currentMoodRef.current === 'excited' && isRubbingActiveRef.current)) { const jitter = (Math.random() - 0.5) * 0.05; tx += jitter; ty += jitter; tz += jitter; }
                        if (frictionHeatRef.current > 0.01) { const heat = frictionHeatRef.current * 2.0; tx += (Math.random() - 0.5) * heat; ty += (Math.random() - 0.5) * heat; tz += (Math.random() - 0.5) * heat; }
                        if (vibrationRef.current > 0) { const shake = (Math.random() - 0.5) * vibrationRef.current * 0.5; tx += shake; ty += shake; tz += shake; }
                        if (floodRef.current !== 0) { const floodFactor = Math.abs(floodRef.current); tx *= (1 + floodFactor * 30); ty *= (1 + floodFactor * 30); tz += floodFactor * 25; }

                        currentPosVec.set(positionsAttribute.array[i3], positionsAttribute.array[i3+1], positionsAttribute.array[i3+2]);
                        targetPosVec.set(tx, ty, tz);
                        const noiseAmp = prefersReducedMotion ? 0 : 0.01 + (frictionHeatRef.current * 0.1);
                        const noise = prefersReducedMotion ? 0 : Math.sin(time * 5 + i) * noiseAmp;
                        let speed;
                        if (isReturningRef.current) speed = 0.12; else if (isLockedRef.current) speed = 0.08; else if (frictionHeatRef.current > 0.5) speed = 0.2; else speed = prefersReducedMotion ? 0.01 : 0.03; 
                        currentPosVec.lerp(targetPosVec, speed);
                        positionsAttribute.array[i3] = currentPosVec.x + noise; positionsAttribute.array[i3+1] = currentPosVec.y + noise; positionsAttribute.array[i3+2] = currentPosVec.z;
                        tempColor.setRGB(colorsAttribute.array[i3], colorsAttribute.array[i3+1], colorsAttribute.array[i3+2]);
                        const finalTargetColor = targetColor.clone().lerp(hotColorObj, Math.min(1, frictionHeatRef.current * 1.5));
                        tempColor.lerp(finalTargetColor, 0.1);
                        colorsAttribute.array[i3] = tempColor.r; colorsAttribute.array[i3+1] = tempColor.g; colorsAttribute.array[i3+2] = tempColor.b;
                    }
                    positionsAttribute.needsUpdate = true; colorsAttribute.needsUpdate = true;

                    const bgPosAttr = bgParticlesSystem.geometry.attributes.position;
                    for(let i = 0; i < bgCount; i++) {
                        const i3 = i * 3;
                        bgPosAttr.array[i3] += bgVelocities[i].x * speedFactor; bgPosAttr.array[i3+1] += bgVelocities[i].y * speedFactor; bgPosAttr.array[i3+2] += bgVelocities[i].z * speedFactor;
                        if (Math.abs(bgPosAttr.array[i3]) > 15) bgPosAttr.array[i3] *= -0.9;
                        if (Math.abs(bgPosAttr.array[i3+1]) > 15) bgPosAttr.array[i3+1] *= -0.9;
                        if (!prefersReducedMotion) bgPosAttr.array[i3+1] += Math.sin(time * 0.5 + bgPosAttr.array[i3]) * 0.002;
                    }
                    bgPosAttr.needsUpdate = true;
                    bgParticlesSystem.rotation.y = time * 0.05 * speedFactor + (frictionHeatRef.current * 0.1); 
                    
                    if (accentParticlesSystem && !prefersReducedMotion) {
                        const accPosAttr = accentParticlesSystem.geometry.attributes.position;
                        for(let i = 0; i < accentCount; i++) {
                            const i3 = i * 3;
                            accPosAttr.array[i3] += accentVelocities[i].x; accPosAttr.array[i3+1] += accentVelocities[i].y; accPosAttr.array[i3+2] += accentVelocities[i].z;
                            if (Math.abs(accPosAttr.array[i3]) > 10) accPosAttr.array[i3] *= -0.9;
                            if (Math.abs(accPosAttr.array[i3+1]) > 10) accPosAttr.array[i3+1] *= -0.9;
                            accPosAttr.array[i3+1] += Math.sin(time * 0.8 + accPosAttr.array[i3]) * (0.003 + frictionHeatRef.current * 0.02);
                        }
                        accPosAttr.needsUpdate = true;
                    }

                    prevMouseRef.current.copy(mouseRef.current);
                    renderer.render(scene, camera);
                };
                animate();
                
                const unlockAudio = () => {
                    if (audioManagerRef.current) {
                        audioManagerRef.current.wakeUpAudio();
                    }
                    window.removeEventListener('touchstart', unlockAudio);
                    window.removeEventListener('click', unlockAudio);
                };
                window.addEventListener('touchstart', unlockAudio);
                window.addEventListener('click', unlockAudio);

                const handleVisibilityChange = () => {
                    if (document.hidden) {
                        if (audioManagerRef.current) audioManagerRef.current.suspendForVisibility();
                    } else {
                        if (audioManagerRef.current) audioManagerRef.current.resumeFromVisibility();
                    }
                };
                document.addEventListener('visibilitychange', handleVisibilityChange);

                return () => { 
                    window.removeEventListener('mousemove', onMouseMove); 
                    window.removeEventListener('resize', onResize); 
                    window.removeEventListener('touchstart', unlockAudio);
                    window.removeEventListener('click', unlockAudio);
                    document.removeEventListener('visibilitychange', handleVisibilityChange);
                    cancelAnimationFrame(reqId);
                    if(mountRef.current) mountRef.current.innerHTML = ''; 
                    renderer.dispose(); 
                    if (audioManagerRef.current && audioManagerRef.current.ctx) audioManagerRef.current.ctx.close();
                };
            }, []);

            const toggleMute = (e) => {
                e.stopPropagation();
                // e.preventDefault(); // Garder le click par défaut pour l'accessibilité
                
                if (audioManagerRef.current) {
                    audioManagerRef.current.init();
                    audioManagerRef.current.wakeUpAudio();
                }
                
                const newMuteState = !isMuted;
                setIsMuted(newMuteState);
                if(audioManagerRef.current) {
                    audioManagerRef.current.setGlobalMute(newMuteState);
                    
                    if (newMuteState) {
                        audioManagerRef.current.fadeOutBGM();
                    } else {
                        audioManagerRef.current.startBGM();
                    }
                }
            };

            const handleInteraction = (e) => {
                // Si l'interaction vient d'un bouton ou lien, on laisse faire l'événement natif
                if (e.target.closest('button') || e.target.closest('a')) return;

                if(audioManagerRef.current) {
                    audioManagerRef.current.init();
                    audioManagerRef.current.wakeUpAudio();
                }
                
                if (sceneStep === 2) return;
                
                if (sceneStep === 0) { 
                    setSceneStep(1); 
                    window._introStartTime = Date.now(); 
                    
                    if(audioManagerRef.current && !isMuted) { 
                        audioManagerRef.current.playIntro(); 
                        audioManagerRef.current.startBGM();
                    }
                    return; 
                }
                
                if (clickCount < 10) {
                    
                    const nextCount = clickCount + 1;
                    const phraseIndex = nextCount - 1;

                    if (audioManagerRef.current && !isMuted) {
                        if (nextCount < 10) {
                            const sfxUrl = SFX_CLICKS[sfxIndexRef.current % SFX_CLICKS.length];
                            audioManagerRef.current.playSound(sfxUrl);
                            sfxIndexRef.current = sfxIndexRef.current + 1;
                        } else if (nextCount === 10) {
                            audioManagerRef.current.playSound(SFX_SUCCESS);
                        }
                    }

                    setIsClickAnimating(true);
                    setTimeout(() => setIsClickAnimating(false), 300);

                    vibrationRef.current = 1.0; 
                    
                    if (POETIC_PHRASES[phraseIndex]) {
                        const shapeName = POETIC_PHRASES[phraseIndex].shape;
                        targetGeometryRef.current = shapeName;
                        isLockedRef.current = true;
                        isReturningRef.current = false;
                        
                        if (window.shapeTimeout) clearTimeout(window.shapeTimeout);
                        
                        setCurrentMessage(POETIC_PHRASES[phraseIndex]); 
                        setMessageVisible(true); 
                        
                        window.shapeTimeout = setTimeout(() => { 
                            setMessageVisible(false);
                            
                            if (nextCount < 10) {
                                targetGeometryRef.current = 'sphere'; 
                                isLockedRef.current = false;
                                isReturningRef.current = true;
                                setTimeout(() => { isReturningRef.current = false; }, 2000 + 200);
                            }
                        }, ANIMATION_DURATION); 
                    }

                    setClickCount(nextCount);
                    
                    if (nextCount === 10) { 
                        setTimeout(() => {
                            if(audioManagerRef.current && !isMuted) { 
                                audioManagerRef.current.fadeOutBGM();
                            }
                        }, ANIMATION_DURATION);
                        
                        setTimeout(() => { floodRef.current = 0.1; }, ANIMATION_DURATION); 
                        setTimeout(() => setSceneStep(2), ANIMATION_DURATION + TRANSITION_DELAY);
                    }
                }
            };

            const resetExperience = (e) => { 
                e.stopPropagation();
                // e.preventDefault(); // Garder pour clavier
                
                // Reset focus to top
                const mainElement = document.getElementById('scroll-container');
                if(mainElement) {
                    mainElement.scrollTop = 0;
                    mainElement.focus();
                }

                if (audioManagerRef.current) {
                    if (!isMuted) {
                         audioManagerRef.current.playReset();
                         audioManagerRef.current.fadeInBGM();
                    }
                }
                setSceneStep(0); 
                setClickCount(0); 
                sfxIndexRef.current = 0; 
                setCurrentMessage(null); 
                setMessageVisible(false); 
                targetGeometryRef.current = 'sphere'; 
                isLockedRef.current = false; 
                isReturningRef.current = false;
                floodRef.current = -5.0;
                setCurrentView('home'); 
            };

            const switchView = (newView) => {
                setCurrentView(newView);
                const scrollContainer = document.getElementById('scroll-container');
                if(scrollContainer) scrollContainer.scrollTop = 0;
            };
            
            const openProjectModal = (project) => {
                setSelectedProject(project);
            };

            const closeProjectModal = () => {
                setSelectedProject(null);
            };

            const CurrentIcon = currentMessage ? currentMessage.icon : Disc;
            const currentAnim = currentMessage ? currentMessage.anim : "animate-spin-slow";

            return (
                <div 
                    className="relative w-full h-[100dvh] bg-[#020205] overflow-hidden font-sans select-none text-white custom-cursor" 
                    onPointerDown={handleInteraction}
                    role="application"
                    aria-label="Expérience immersive portfolio"
                >
                    <div ref={mountRef} className="absolute inset-0 z-0" aria-hidden="true" />
                    
                    {/* MODAL */}
                    {selectedProject && (
                        <ProjectModal project={selectedProject} onClose={closeProjectModal} />
                    )}
                    
                    {/* MUTE TOGGLE BUTTON */}
