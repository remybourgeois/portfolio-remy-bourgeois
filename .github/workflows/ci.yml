name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Audit des dépendances
        # Bloque sur une vulnérabilité haute ou critique : la dérive se voyait
        # jusqu'ici seulement en lançant npm audit à la main.
        run: npm audit --audit-level=high

      - name: Type & a11y check
        run: npm run check

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
