[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"

# L'ancienne page de contenu vivait sur /home, la racine n'étant qu'une intro
# WebGL en noindex : tous les backlinks externes atterrissaient donc sur une
# page non indexable. « / » sert maintenant le contenu, et /home est redirigé
# de façon permanente pour ne pas perdre l'historique d'indexation.
[[redirects]]
  from   = "/home"
  to     = "/"
  status = 301
  force  = true

# /services a été publiée puis retirée. Une 301 plutôt qu'un 404 : la page a
# été en ligne assez longtemps pour être découverte, et un visiteur qui suit
# un ancien lien doit arriver quelque part d'utile.
[[redirects]]
  from   = "/services"
  to     = "/"
  status = 301
  force  = true

# Toutes les routes réelles sont prérendues en fichiers statiques : rien n'a
# besoin d'un fallback SPA. Servir 404.html avec un statut 200 produisait des
# soft 404 — Google indexait des URLs inexistantes sans pouvoir les nettoyer.
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404

# Assets fingerprintés par Vite (nom hashé) → cache long immuable.
[[headers]]
  for = "/_app/immutable/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Médias (images, audio, vidéo) : noms non hashés → cache 7 jours
# (une mise à jour d'asset peut rester en cache jusqu'à 7 j pour les visiteurs récurrents).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# En-têtes de sécurité sur tout le site.
# La CSP est générée par SvelteKit (kit.csp dans svelte.config.js), qui calcule
# les hash des scripts inlinés au build : elle n'est donc pas répétée ici.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
