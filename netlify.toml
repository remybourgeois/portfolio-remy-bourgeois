[build]
  command = "npm run build"
  publish = "build"

# SPA fallback : toutes les URLs non trouvées servent 404.html avec status 200
# pour que le routeur client-side de SvelteKit prenne le relais.
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
